pg_stat_statements:
  query: |
    SELECT
      current_database() AS datname,
      COALESCE(SUM(calls), 0)::bigint AS calls,
      COALESCE(SUM(total_exec_time), 0) / 1000.0 AS total_exec_time_seconds,
      COALESCE(SUM(shared_blks_hit), 0)::bigint AS shared_blocks_hit,
      COALESCE(SUM(shared_blks_read), 0)::bigint AS shared_blocks_read
    FROM pg_stat_statements
  master: true
  metrics:
    - datname:
        usage: LABEL
        description: Database name
    - calls:
        usage: COUNTER
        description: Total tracked statement calls
    - total_exec_time_seconds:
        usage: COUNTER
        description: Total tracked statement execution time in seconds
    - shared_blocks_hit:
        usage: COUNTER
        description: Total shared block cache hits by tracked statements
    - shared_blocks_read:
        usage: COUNTER
        description: Total shared block reads by tracked statements

pg_backend_activity:
  query: |
    SELECT
      COALESCE(state, 'unknown') AS state,
      COUNT(*)::bigint AS connections,
      COUNT(*) FILTER (WHERE wait_event IS NOT NULL)::bigint AS waiting
    FROM pg_stat_activity
    WHERE application_name = 'ticketing_backend_phase10a'
    GROUP BY COALESCE(state, 'unknown')
  metrics:
    - state:
        usage: LABEL
        description: Backend connection state
    - connections:
        usage: GAUGE
        description: Ticketing backend connections by state
    - waiting:
        usage: GAUGE
        description: Ticketing backend connections with a wait event by state

pg_lock_summary:
  query: |
    SELECT
      COUNT(*)::bigint AS total,
      COUNT(*) FILTER (WHERE NOT granted)::bigint AS waiting
    FROM pg_locks
  metrics:
    - total:
        usage: GAUGE
        description: Total PostgreSQL locks
    - waiting:
        usage: GAUGE
        description: PostgreSQL locks waiting to be granted
