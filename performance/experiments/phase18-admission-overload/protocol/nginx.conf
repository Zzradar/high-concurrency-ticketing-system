events { worker_connections 256; }
http {
 include /etc/nginx/mime.types;
 log_format phase18 '$msec $request_method $uri $status $upstream_addr $upstream_status';
 access_log /dev/stdout phase18;
 server {
  listen 8080;
  root /web;
  add_header X-Phase18-Fixture stage0-v2 always;
  location /api/ { proxy_pass http://phase18v2-api:8080/; }
  location / { try_files $uri $uri/ /index.html; }
 }
}
